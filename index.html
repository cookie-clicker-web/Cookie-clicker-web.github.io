<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cookie Clicker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7e6cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookie Clicker">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{min-height:100%;overscroll-behavior:none}
html{height:100%;overflow:hidden;background:#f7e6cf}
body{height:100%;height:100dvh;overflow-y:auto;background:radial-gradient(circle at top,#ffffff 0%,#fdf3e4 60%,#f7e6cf 100%) #f7e6cf;color:#3b2716;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:flex-start;justify-content:center}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:420px;padding:28px 20px 40px;text-align:center}
.stats{text-align:center;width:100%}
#count{font-size:clamp(2.4rem,9vw,3.4rem);font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:#3b2716}
#clicksps{margin-top:4px;font-size:0.95rem;opacity:0.75;font-variant-numeric:tabular-nums}
#cps{margin-top:4px;font-size:0.95rem;opacity:0.75;font-variant-numeric:tabular-nums}
#timer{margin-top:6px;font-size:0.75rem;opacity:0.5;font-variant-numeric:tabular-nums}
.cookieWrap{position:relative;width:min(64vw,250px);height:min(64vw,250px);margin:30px 0}
#cookie{position:absolute;inset:0;width:100%;height:100%;border:none;background:none;padding:0;cursor:pointer;transition:transform 0.08s ease-out;outline:none}
#cookie:active{transform:scale(0.94)}
#cookie svg{width:100%;height:100%;display:block}
#cookie.gold #dough stop:nth-child(1){stop-color:#fff6c4}
#cookie.gold #dough stop:nth-child(2){stop-color:#f5c542}
#cookie.gold #dough stop:nth-child(3){stop-color:#b8860b}
.cookieWrap::before{content:'';position:absolute;inset:-4% -8% -14% -8%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,70,20,0.3) 0%,rgba(120,70,20,0.18) 55%,rgba(120,70,20,0) 100%);pointer-events:none}
#cookie.pulse{animation:pulse 0.15s ease-out}
@keyframes pulse{50%{transform:scale(1.04)}}
.orbit{position:absolute;inset:0;pointer-events:none}
.orbit.hidden{display:none}
.ptr{position:absolute;top:calc(50% - 15px);left:calc(50% - 15px);width:30px;height:30px;will-change:transform}
.ptr svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3))}
.shop{display:flex;flex-direction:column;gap:12px;width:100%}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:16px 18px;background:linear-gradient(180deg,#ffc75e,#f59a2b);border:2px solid #b8600f;border-radius:16px;color:#3b1f08;font:inherit;cursor:pointer;text-align:left;box-shadow:0 4px 0 #b8600f,0 8px 16px rgba(120,60,10,0.25);transition:transform 0.1s,box-shadow 0.1s,filter 0.15s}
.item:hover:not(:disabled){filter:brightness(1.05)}
.item:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b8600f,0 4px 8px rgba(120,60,10,0.2)}
.item:disabled{background:linear-gradient(180deg,#e9e2d8,#d6cbbd);border-color:#b3a391;color:#8a7b68;box-shadow:0 4px 0 #b3a391;cursor:default}
.left{display:flex;flex-direction:column;gap:3px;text-align:left}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.name{font-weight:800;font-size:1.02rem}
.meta{font-size:0.78rem;opacity:0.8}
.cost{font-weight:900;font-size:1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.status{font-size:0.72rem;font-weight:800;letter-spacing:0.02em;padding:3px 8px;border-radius:999px;background:#3b1f08;color:#ffd27a;white-space:nowrap}
.item:disabled .status{background:#b3a391;color:#fff7ea}
.owned{font-size:0.8rem;opacity:0.75;margin-left:6px;font-weight:700}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:1.9rem;color:#8a3d00;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 8px #fff,0 2px 4px rgba(0,0,0,0.3);transform:translate(-50%,-50%);animation:rise 0.9s ease-out forwards;z-index:10}
@keyframes rise{0%{transform:translate(-50%,-50%) scale(0.8)}20%{transform:translate(-50%,-70%) scale(1.15)}100%{transform:translate(-50%,-150px) scale(1);opacity:0}}
.ach{width:100%;background:rgba(255,255,255,0.75);border:1px solid rgba(120,70,20,0.12);border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(120,70,20,0.08)}
.achHead{width:100%;background:none;border:none;font:inherit;font-weight:800;font-size:1rem;color:#3b2716;cursor:pointer;padding:4px;text-align:center}
.achBody{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 0.4s ease,opacity 0.3s ease,margin-top 0.4s ease;margin-top:0}
.achBody.open{grid-template-rows:1fr;opacity:1;margin-top:12px}
.achBody>.achgrid{min-height:0;overflow:hidden}
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.achcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.badge{height:48px;display:flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:12px;background:#eee3d3;border:1px solid transparent;font-size:0.8rem;line-height:1.2;color:#7a6650;opacity:0.6;text-align:center}
.badge.wide{grid-column:1 / -1;height:56px;font-size:0.95rem;font-weight:900;letter-spacing:0.04em}
.badge.wide.on{background:linear-gradient(180deg,#fff6c4,#f5c542 55%,#d9a02a);color:#3b1f08;border-color:#b8860b}
.badge.on{background:linear-gradient(180deg,#ffd27a,#f5b04a);color:#3b1f08;opacity:1;font-weight:800;border:1px solid #b8600f}
#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-160%);background:#3b2716;color:#fff7ea;padding:12px 20px;border-radius:14px;font-weight:700;font-size:0.95rem;transition:transform 0.35s ease;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,0.25);white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
.menu{position:fixed;top:14px;right:14px;z-index:25;width:40px;height:40px}
.panel{position:absolute;top:0;right:0;width:40px;height:40px;background:rgba(255,255,255,0.85);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(120,70,20,0.15);transition:width 0.35s cubic-bezier(.2,.9,.3,1),height 0.35s cubic-bezier(.2,.9,.3,1),border-radius 0.35s ease,box-shadow 0.3s ease}
.panel.open{width:200px;height:150px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,0.2)}
#menuBtn{position:absolute;top:0;right:0;width:40px;height:40px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:2;transition:opacity 0.18s ease}
#menuBtn span{width:5px;height:5px;border-radius:50%;background:#3b2716;display:block}
.panel.open #menuBtn{opacity:0;pointer-events:none}
.panelInner{position:absolute;top:0;left:0;width:200px;padding:0;text-align:center;opacity:0;pointer-events:none;transition:opacity 0.12s ease}
.panel.open .panelInner{opacity:1;pointer-events:auto;transition:opacity 0.25s ease 0.18s}
#musicBtn,#clearBtn,.setBtn{width:100%;padding:8px 8px;border:none;background:none;border-radius:0;font:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;text-align:center}
#musicBtn{color:#3b2716}
#musicBtn:hover,#clearBtn:hover,.setBtn:hover{background:rgba(120,70,20,0.08)}
#clearBtn{color:#a1260d}
.setBtn{color:#3b2716}
.divider{border:none;border-top:1px solid rgba(120,70,20,0.15);margin:4px 0}
.warn{position:fixed;inset:0;background:rgba(40,25,15,0.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.warn.hidden{display:none}
.warnbox{background:#fff7ea;border-radius:18px;padding:24px 22px;max-width:320px;width:100%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,0.3)}
.warnbox h2{font-size:1.2rem;margin-bottom:10px}
.warnbox p{font-size:0.92rem;line-height:1.4;margin-bottom:8px}
#warnReason{font-size:0.8rem;color:#7a6650;min-height:1.2em}
#warnCount{font-weight:900;color:#a1260d;min-height:1.2em}
@media (min-width:800px){
.wrap{display:grid;grid-template-columns:300px 1fr 300px;grid-template-areas:"ach stats shop" "ach cookie shop";align-items:start;column-gap:40px;row-gap:12px;max-width:1280px;padding:48px 32px 40px}
.ach{grid-area:ach;position:sticky;top:48px}
.achHead{pointer-events:none;cursor:default}
.achBody{grid-template-rows:1fr;opacity:1;margin-top:12px}
.achgrid{grid-template-columns:1fr 1fr}
.stats{grid-area:stats}
.cookieWrap{grid-area:cookie;width:340px;height:340px;margin:0 auto;justify-self:center;align-self:start}
.shop{grid-area:shop}
}
#warnOk{margin-top:12px;width:100%;padding:12px;border:2px solid #b8600f;border-radius:14px;background:linear-gradient(180deg,#ffc75e,#f59a2b);color:#3b1f08;font:inherit;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="menu">
  <div id="menuPanel" class="panel">
    <button id="menuBtn" aria-label="menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="panelInner">
      <button id="musicBtn">music on</button>
      <hr class="divider">
      <button id="clearBtn">clear progress</button>
      <hr class="divider">
      <button id="perfBtn" class="setBtn">performance: low</button>
      <button id="counterBtn" class="setBtn">counter: low</button>
      <button id="cursorsBtn" class="setBtn">cursors: high</button>
    </div>
  </div>
</div>
<audio id="bgm" loop preload="auto"><source src="default.mp3" type="audio/mpeg"></audio>
<div class="wrap">
  <div class="stats">
    <div id="clicksps">0 clicks per second</div>
    <div id="cps">0.0 cookies per second from cursors</div>
    <div id="count">0</div>
    <div id="timer">0:00</div>
  </div>
  <div class="cookieWrap">
    <div class="orbit hidden" id="orbit"></div>
    <button id="cookie" aria-label="cookie">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="dough" cx="42%" cy="36%" r="70%">
            <stop offset="0%" stop-color="#f7cf8a"/>
            <stop offset="55%" stop-color="#e0a052"/>
            <stop offset="100%" stop-color="#b56e2c"/>
          </radialGradient>
          <radialGradient id="chip" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#7a4522"/>
            <stop offset="100%" stop-color="#2e1608"/>
          </radialGradient>
          <radialGradient id="edge" cx="50%" cy="50%" r="50%">
            <stop offset="82%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#7a3f12" stop-opacity="0.55"/>
          </radialGradient>
        </defs>
        <path d="M100 4 C138 2 168 18 184 44 C198 66 198 92 194 116 C190 144 176 168 152 184 C128 198 96 199 72 190 C44 180 22 162 12 136 C2 110 4 80 14 56 C26 28 58 6 100 4 Z" fill="url(#dough)"/>
        <path d="M100 4 C138 2 168 18 184 44 C198 66 198 92 194 116 C190 144 176 168 152 184 C128 198 96 199 72 190 C44 180 22 162 12 136 C2 110 4 80 14 56 C26 28 58 6 100 4 Z" fill="url(#edge)"/>
        <ellipse cx="72" cy="48" rx="16" ry="11" fill="#fbe2ad" opacity="0.45" transform="rotate(-18 72 48)"/>
        <path d="M60 58 L76 52 L82 66 L66 72 Z" fill="url(#chip)" transform="rotate(-8 72 62)"/>
        <path d="M118 36 L134 32 L138 46 L122 50 Z" fill="url(#chip)"/>
        <path d="M150 74 L166 72 L168 86 L152 88 Z" fill="url(#chip)"/>
        <path d="M40 102 L56 96 L62 110 L46 116 Z" fill="url(#chip)"/>
        <path d="M92 96 L110 92 L116 108 L98 112 Z" fill="url(#chip)"/>
        <path d="M134 118 L152 114 L156 128 L138 132 Z" fill="url(#chip)"/>
        <path d="M70 140 L86 136 L90 150 L74 154 Z" fill="url(#chip)"/>
        <path d="M108 158 L124 154 L128 168 L112 172 Z" fill="url(#chip)"/>
        <path d="M30 148 L44 144 L48 156 L34 160 Z" fill="url(#chip)"/>
        <path d="M170 150 L180 148 L182 158 L172 160 Z" fill="url(#chip)"/>
      </svg>
    </button>
  </div>
  <div class="shop">
    <button class="item" id="cursorBtn">
      <div class="left">
        <span class="name">cursor <span class="owned" id="cursorOwned"></span></span>
        <span class="meta" id="cursorMeta"></span>
      </div>
      <div class="right">
        <span class="cost" id="cursorCost"></span>
        <span class="status" id="cursorStatus"></span>
      </div>
    </button>
    <button class="item" id="clickBtn">
      <div class="left">
        <span class="name">cookie per click <span class="owned" id="clickOwned"></span></span>
        <span class="meta" id="clickMeta"></span>
      </div>
      <div class="right">
        <span class="cost" id="clickCost"></span>
        <span class="status" id="clickStatus"></span>
      </div>
    </button>
    <button class="item" id="rushBtn">
      <div class="left">
        <span class="name">rush</span>
        <span class="meta">2.8x cookies per click for 10 seconds</span>
      </div>
      <div class="right">
        <span class="cost" id="rushCost"></span>
        <span class="status" id="rushStatus"></span>
      </div>
    </button>
  </div>
  <div class="ach" id="achBox">
    <button class="achHead" id="achToggle" aria-expanded="false"><span id="achSummary">achievements</span></button>
    <div class="achBody" id="achBody">
      <div class="achgrid" id="achGrid"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="warn" class="warn hidden">
  <div class="warnbox">
    <h2>auto clicker detected</h2>
    <p>stop the auto clicking or your progress will be deleted</p>
    <p id="warnReason"></p>
    <p id="warnCount"></p>
    <button id="warnOk">continue</button>
  </div>
</div>
<script>
const SAVE_KEY = 'cookieclicker-save-v1';
const MUSIC_KEY = 'cookieclicker-music';
const PERF_KEY = 'cookieclicker-perf';
const COUNTER_KEY = 'cookieclicker-counter';
const CURSOR_KEY = 'cookieclicker-cursors';
const CURSOR_CPS_EARLY = 0.2;
const CURSOR_CPS_LATE = 0.5;
const CURSOR_HALF = 17;
const CURSOR_BASE = 15;
const CURSOR_GROWTH = 1.04;
const MAX_CURSORS = 35;
const CLICK_BASE = 40;
const CLICK_GROWTH = 1.3;
const CLICK_STEP = 0.2;
const MAX_CLICK_LEVEL = 25;
const MAX_VISIBLE_CURSORS = 12;
const RUSH_COST = 1500;
const RUSH_MS = 10000;
const RUSH_MULT = 2.8;
const RUSH_STEP_MS = 8 * 60000;
const RUSH_STEP_GROWTH = 1.25;
const COOLDOWN = 40;
const DETECT_REJECTS = 10;
const WIPE_MS = 60000;
const ORBIT_RADIUS = 150;
const ORBIT_DEG_PER_MS = 0.2;
const PTR_DEFAULT_DEG = 128.66;
const PTR_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 2 L4 20 L9 15.5 L12 22 L15 20.7 L12 14.3 L19 14.3 Z" fill="#ffffff" stroke="#3b2716" stroke-width="1.6" stroke-linejoin="round"/></svg>';

const state = { cookies: 0, total: 0, cursors: 0, clickLevel: 1, rushLeft: 0, rushStart: null };
let elapsed = 0;
let orbitAngle = 0;
let frameNo = 0;
let forceCount = true;
let perfMaster = localStorage.getItem(PERF_KEY) === 'high' ? 'high' : 'low';
let counterHigh = (localStorage.getItem(COUNTER_KEY) ?? perfMaster) === 'high';
let cursorsHigh = (localStorage.getItem(CURSOR_KEY) ?? perfMaster) === 'high';
let running = false;
const unlocked = new Set();
const userClickTimes = [];
const pointers = [];
let lastBuzz = 0;
let lastDown = 0;
let lastAccept = 0;
let pending = null;
let rejects = [];
let untrustedUntil = 0;
let flagUntil = 0;
let paused = false;
let warnedOnce = false;
let flaggedMs = 0;
let wiping = false;
let clearArmed = false;
let clearTimer = null;
const clickLog = [];
let runAnchor = null;
let runStart = 0;
let runCount = 0;
let runLast = 0;

let musicOn = localStorage.getItem(MUSIC_KEY) !== '0';
let musicPlaying = false;
let detectReason = '';
const recentTimes = [];

const ACHIEVEMENTS = [
  { id: 't5', label: '5 minutes played', check: () => elapsed >= 5 * 60000 },
  { id: 't30', label: '30 minutes played', check: () => elapsed >= 30 * 60000 },
  { id: 't60', label: '1 hour played', check: () => elapsed >= 60 * 60000 },
  { id: 't120', label: '2 hours played', check: () => elapsed >= 120 * 60000 },
  { id: 't300', label: '5 hours played', check: () => elapsed >= 300 * 60000 },
  { id: 't600', label: '10 hours played', check: () => elapsed >= 600 * 60000 },
  { id: 't900', label: '15 hours played', check: () => elapsed >= 900 * 60000 },
  { id: 't1440', label: '24 hours played', check: () => elapsed >= 1440 * 60000 },
  { id: 't2880', label: '48 hours played', check: () => elapsed >= 2880 * 60000 },
  { id: 'c500', label: '500 cookies', check: () => state.total >= 500 },
  { id: 'c1k', label: '1,000 cookies', check: () => state.total >= 1e3 },
  { id: 'c10k', label: '10,000 cookies', check: () => state.total >= 1e4 },
  { id: 'c100k', label: '100,000 cookies', check: () => state.total >= 1e5 },
  { id: 'c1m', label: '1,000,000 cookies', check: () => state.total >= 1e6 },
  { id: 'c10m', label: '10,000,000 cookies', check: () => state.total >= 1e7 },
  { id: 'c100m', label: '100,000,000 cookies', check: () => state.total >= 1e8 },
  { id: 'c1b', label: '1,000,000,000 cookies', check: () => state.total >= 1e9 },
  { id: 'c10b', label: '10,000,000,000 cookies', check: () => state.total >= 1e10 }
];

const $ = id => document.getElementById(id);
const el = {
  count: $('count'), cps: $('cps'), clicksps: $('clicksps'), timer: $('timer'), cookie: $('cookie'),
  orbit: $('orbit'),
  cursorBtn: $('cursorBtn'), cursorMeta: $('cursorMeta'), cursorCost: $('cursorCost'), cursorOwned: $('cursorOwned'), cursorStatus: $('cursorStatus'),
  clickBtn: $('clickBtn'), clickCost: $('clickCost'), clickOwned: $('clickOwned'), clickMeta: $('clickMeta'), clickStatus: $('clickStatus'),
  rushBtn: $('rushBtn'), rushCost: $('rushCost'), rushStatus: $('rushStatus'),
  achBox: $('achBox'), achGrid: $('achGrid'), achSummary: $('achSummary'), achToggle: $('achToggle'), achBody: $('achBody'), toast: $('toast'),
  menuBtn: $('menuBtn'), menuPanel: $('menuPanel'), musicBtn: $('musicBtn'), clearBtn: $('clearBtn'), perfBtn: $('perfBtn'), counterBtn: $('counterBtn'), cursorsBtn: $('cursorsBtn'),
  warn: $('warn'), warnReason: $('warnReason'), warnCount: $('warnCount'), warnOk: $('warnOk'), bgm: $('bgm')
};

el.bgm.volume = 0.5;

function cursorPrice() { return Math.ceil(CURSOR_BASE * Math.pow(CURSOR_GROWTH, state.cursors)); }
function cursorCps(n) { return Math.min(n, CURSOR_HALF) * CURSOR_CPS_EARLY + Math.max(0, n - CURSOR_HALF) * CURSOR_CPS_LATE; }
function clickValue(level) {
  let v = 1;
  for (let k = 1; k < level; k++) v += CLICK_STEP * Math.sqrt(k);
  return Math.round(v * 10) / 10;
}
function setText(node, text) {
  if (node._t !== text) { node.textContent = text; node._t = text; }
}
function clickPrice() { return Math.ceil(CLICK_BASE * Math.pow(CLICK_GROWTH, state.clickLevel - 1)); }
function rushPrice() {
  if (state.rushStart === null) return RUSH_COST;
  const steps = Math.floor((elapsed - state.rushStart) / RUSH_STEP_MS);
  return Math.ceil(RUSH_COST * Math.pow(RUSH_STEP_GROWTH, steps));
}

function fmt(n) { return Math.floor(n).toLocaleString(); }

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = String(s % 60).padStart(2, '0');
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + sec;
  return m + ':' + sec;
}

function addCookies(n) {
  state.cookies += n;
  state.total += n;
}

function setButton(btn, costEl, statusEl, price, available, label) {
  setText(costEl, label === undefined ? fmt(price) : label);
  if (available) {
    setText(statusEl, 'buy');
  } else if (label === undefined) {
    setText(statusEl, 'need ' + fmt(price - state.cookies) + ' more');
  } else {
    setText(statusEl, label);
  }
  if (btn.disabled !== !available) btn.disabled = !available;
}

function buy(type) {
  if (paused) return;
  if (type === 'cursor') {
    const price = cursorPrice();
    if (state.cursors < MAX_CURSORS && state.cookies >= price) { state.cookies -= price; state.cursors++; }
  } else if (type === 'click') {
    const price = clickPrice();
    if (state.clickLevel < MAX_CLICK_LEVEL && state.cookies >= price) {
      state.cookies -= price; state.clickLevel++;
    }
  } else if (type === 'rush') {
    const price = rushPrice();
    if (state.rushLeft <= 0 && state.cookies >= price) {
      state.cookies -= price;
      state.rushLeft = RUSH_MS;
      if (state.rushStart === null) state.rushStart = elapsed;
    }
  }
  render();
  save();
}

function spawnFloat(x, y, value) {
  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+' + value;
  f.style.left = x + 'px';
  f.style.top = y + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

function buzz(now) {
  if (!navigator.vibrate) return;
  if (now - lastBuzz < 20) return;
  navigator.vibrate(15);
  lastBuzz = now;
}

function syncPointers() {
  const n = Math.min(state.cursors, visibleCap());
  while (pointers.length < n) {
    const p = document.createElement('div');
    p.className = 'ptr';
    p.innerHTML = PTR_SVG;
    el.orbit.appendChild(p);
    pointers.push(p);
  }
  while (pointers.length > n) {
    pointers.pop().remove();
  }
}

function updateOrbit() {
  const n = pointers.length;
  el.orbit.classList.toggle('hidden', n < 1);
  for (let i = 0; i < n; i++) {
    const a = (orbitAngle + i * 360 / n) * Math.PI / 180;
    const x = ORBIT_RADIUS * Math.cos(a);
    const y = ORBIT_RADIUS * Math.sin(a);
    const heading = Math.atan2(Math.cos(a), -Math.sin(a)) * 180 / Math.PI;
    const rot = heading + PTR_DEFAULT_DEG;
    pointers[i].style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + rot + 'deg)';
  }
}

function updateMusic() {
  const want = musicOn && running && !paused;
  if (want === musicPlaying) return;
  musicPlaying = want;
  if (want) {
    const p = el.bgm.play();
    if (p && p.catch) p.catch(() => {});
  } else {
    el.bgm.pause();
  }
}

function setMusicOn(on) {
  musicOn = on;
  try { localStorage.setItem(MUSIC_KEY, on ? '1' : '0'); } catch (e) {}
  el.musicBtn.textContent = on ? 'music on' : 'music off';
  updateMusic();
}

function silenceMusic() {
  musicPlaying = false;
  el.bgm.pause();
}

function flagClick(t, reason) {
  flagUntil = t + 2500;
  detectReason = reason;
}

const CLICK_BUFFER = 30;
const SAME_PIXEL_RUN = 12;
const SAME_PIXEL_MEAN_MS = 220;
const SD_FLAG_MS = 3;
const FAST_MEAN_MS = 300;
const MIN_GAPS_FOR_TIMING = 20;
const CPS_FLAG = 15;
const STRIKES_NEEDED = 2;
const STRIKE_WINDOW_MS = 6000;
const strikes = [];

function addStrike(t, reason) {
  while (strikes.length && t - strikes[0] > STRIKE_WINDOW_MS) strikes.shift();
  strikes.push(t);
  if (strikes.length >= STRIKES_NEEDED) {
    flagClick(t, reason);
    strikes.length = 0;
  }
}

function registerClick(t, x, y) {
  clickLog.push({ t: t, x: x, y: y });
  if (clickLog.length > CLICK_BUFFER) clickLog.shift();
  const n = clickLog.length;

  if (n >= SAME_PIXEL_RUN) {
    let same = true;
    for (let i = n - SAME_PIXEL_RUN; i < n; i++) {
      if (clickLog[i].x !== x || clickLog[i].y !== y) { same = false; break; }
    }
    const spanMs = t - clickLog[n - SAME_PIXEL_RUN].t;
    if (same && spanMs / (SAME_PIXEL_RUN - 1) < SAME_PIXEL_MEAN_MS) {
      addStrike(t, 'Same exact pixel (' + x + ', ' + y + ') ' + SAME_PIXEL_RUN + ' clicks in a row');
    }
  }

  if (n > MIN_GAPS_FOR_TIMING) {
    const gaps = [];
    for (let i = 1; i < n; i++) gaps.push(clickLog[i].t - clickLog[i - 1].t);
    const count = gaps.length;
    const mean = gaps.reduce((a, b) => a + b, 0) / count;
    let m2 = 0;
    gaps.forEach(g => { m2 += (g - mean) * (g - mean); });
    const sd = Math.sqrt(m2 / count);
    if (mean < FAST_MEAN_MS && sd < SD_FLAG_MS) {
      addStrike(t, 'Zero timing variance (gap sd ' + sd.toFixed(1) + ' ms)');
    }
  }

  while (recentTimes.length && t - recentTimes[0] > 2000) recentTimes.shift();
  recentTimes.push(t);
  if (recentTimes.length > CPS_FLAG * 2) {
    flagClick(t, 'Sustained ' + (recentTimes.length / 2).toFixed(0) + ' clicks per second over 2 seconds');
  }
}

document.addEventListener('pointerdown', e => {
  const t = performance.now();
  if (!e.isTrusted) untrustedUntil = t + 2000;
  if (t - lastDown < COOLDOWN) rejects.push(t);
  lastDown = t;
}, true);

el.cookie.addEventListener('pointerdown', e => {
  const t = performance.now();
  if (paused || t - lastAccept < COOLDOWN) { pending = null; return; }
  pending = { x: e.clientX, y: e.clientY, id: e.pointerId };
});

el.cookie.addEventListener('pointerup', e => {
  if (!pending || pending.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - pending.x, e.clientY - pending.y);
  pending = null;
  if (moved > 10 || paused) return;
  const t = performance.now();
  if (t - lastAccept < COOLDOWN) return;
  lastAccept = t;
  running = true;
  updateMusic();
  const mult = state.rushLeft > 0 ? RUSH_MULT : 1;
  const value = Math.round(clickValue(state.clickLevel) * mult * 100) / 100;
  addCookies(value);
  userClickTimes.push(t);
  registerClick(t, e.clientX, e.clientY);
  buzz(t);
  spawnFloat(e.clientX, e.clientY, value);
  el.cookie.classList.remove('pulse');
  void el.cookie.offsetWidth;
  el.cookie.classList.add('pulse');
});

el.cookie.addEventListener('pointercancel', () => { pending = null; });
el.cookie.addEventListener('contextmenu', e => e.preventDefault());

el.cursorBtn.addEventListener('click', () => buy('cursor'));
el.clickBtn.addEventListener('click', () => buy('click'));
el.rushBtn.addEventListener('click', () => buy('rush'));

const achCols = { t: document.createElement('div'), c: document.createElement('div') };
achCols.t.className = 'achcol';
achCols.c.className = 'achcol';
el.achGrid.appendChild(achCols.t);
el.achGrid.appendChild(achCols.c);
ACHIEVEMENTS.forEach(a => {
  const b = document.createElement('div');
  b.className = 'badge';
  b.id = 'ach-' + a.id;
  b.textContent = a.label;
  achCols[a.id[0]].appendChild(b);
});
const goldBadge = document.createElement('div');
goldBadge.className = 'badge wide';
goldBadge.id = 'ach-gold';
goldBadge.textContent = 'GOLDEN SKIN COOKIE';
el.achGrid.appendChild(goldBadge);

function followBottom(ms) {
  const body = document.body;
  const end = performance.now() + ms;
  function step() {
    body.scrollTop = body.scrollHeight;
    if (performance.now() < end) requestAnimationFrame(step);
  }
  step();
}

el.achToggle.addEventListener('click', () => {
  const open = el.achBody.classList.toggle('open');
  el.achToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) followBottom(450);
});

let toastTimer = null;
function showToast(text) {
  el.toast.textContent = 'achievement unlocked: ' + text;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
}

function refreshAchievementUI() {
  ACHIEVEMENTS.forEach(a => {
    $('ach-' + a.id).classList.toggle('on', unlocked.has(a.id));
  });
  el.achSummary.textContent = 'achievements ' + unlocked.size + '/' + ACHIEVEMENTS.length;
  const allDone = unlocked.size === ACHIEVEMENTS.length;
  el.cookie.classList.toggle('gold', allDone);
  $('ach-gold').classList.toggle('on', allDone);
}

function checkAchievements() {
  let changed = false;
  ACHIEVEMENTS.forEach(a => {
    if (!unlocked.has(a.id) && a.check()) {
      unlocked.add(a.id);
      changed = true;
      showToast(a.label);
    }
  });
  if (changed) {
    refreshAchievementUI();
    save();
  }
}

function render() {
  syncPointers();

  if (counterHigh || forceCount || frameNo % 20 === 0) {
    setText(el.count, fmt(state.cookies));
    forceCount = false;
  }
  setText(el.cps, cursorCps(state.cursors).toFixed(1) + ' cookies per second from cursors');

  const now = performance.now();
  while (userClickTimes.length && now - userClickTimes[0] > 1000) userClickTimes.shift();
  setText(el.clicksps, userClickTimes.length + ' clicks per second');

  setText(el.timer, formatTime(elapsed));

  setText(el.cursorOwned, state.cursors ? '(' + state.cursors + ')' : '');
  setText(el.cursorMeta, state.cursors >= MAX_CURSORS ? 'maxed at ' + cursorCps(MAX_CURSORS).toFixed(1) + ' per second' : 'next: +' + (cursorCps(state.cursors + 1) - cursorCps(state.cursors)).toFixed(1) + ' cookies per second');
  if (state.cursors >= MAX_CURSORS) {
    setButton(el.cursorBtn, el.cursorCost, el.cursorStatus, 0, false, 'max');
    setText(el.cursorStatus, 'maxed');
  } else {
    const cp = cursorPrice();
    setButton(el.cursorBtn, el.cursorCost, el.cursorStatus, cp, state.cookies >= cp);
  }

  const clp = clickPrice();
  const maxed = state.clickLevel >= MAX_CLICK_LEVEL;
  setText(el.clickOwned, 'level ' + state.clickLevel);
  setText(el.clickMeta, maxed ? 'maxed at ' + clickValue(MAX_CLICK_LEVEL) + ' per click' : 'next: ' + clickValue(state.clickLevel + 1) + ' per click');
  if (maxed) {
    setButton(el.clickBtn, el.clickCost, el.clickStatus, 0, false, 'max');
    setText(el.clickStatus, 'maxed');
  } else {
    setButton(el.clickBtn, el.clickCost, el.clickStatus, clp, state.cookies >= clp);
  }

  const rp = rushPrice();
  const rushing = state.rushLeft > 0;
  setButton(el.rushBtn, el.rushCost, el.rushStatus, rp, !rushing && state.cookies >= rp);
  if (rushing) setText(el.rushStatus, 'active ' + Math.ceil(state.rushLeft / 1000) + 's');
}

function save() {
  if (wiping) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      cookies: state.cookies,
      total: state.total,
      cursors: state.cursors,
      clickLevel: state.clickLevel,
      rushStart: state.rushStart,
      elapsed: elapsed,
      unlocked: [...unlocked]
    }));
  } catch (e) {}
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return;
    state.cookies = d.cookies || 0;
    state.total = d.total || 0;
    state.cursors = d.cursors || 0;
    state.clickLevel = d.clickLevel || 1;
    state.rushStart = typeof d.rushStart === 'number' ? d.rushStart : null;
    elapsed = d.elapsed || 0;
    (d.unlocked || []).forEach(id => unlocked.add(id));
  } catch (e) {}
}

function wipe() {
  wiping = true;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
}

function suspicious(now) {
  rejects = rejects.filter(t => now - t < 2000);
  if (now < untrustedUntil) detectReason = 'Scripted click event (not from a real finger or mouse)';
  else if (rejects.length >= DETECT_REJECTS) detectReason = 'Clicks faster than 40 ms apart';
  return rejects.length >= DETECT_REJECTS || now < flagUntil || now < untrustedUntil;
}

function updateWarnCount() {
  if (!warnedOnce) {
    el.warnCount.textContent = '';
    return;
  }
  const left = Math.max(0, Math.ceil((WIPE_MS - flaggedMs) / 1000));
  setText(el.warnCount, 'progress deletes in ' + left + 's');
}

function showWarn() {
  el.warnReason.textContent = detectReason ? 'Reason: ' + detectReason : '';
  el.warnOk.textContent = warnedOnce ? 'continue anyway' : 'continue';
  el.warn.classList.remove('hidden');
  updateWarnCount();
}

function hideWarn() {
  el.warn.classList.add('hidden');
}

el.warnOk.addEventListener('click', () => {
  rejects = [];
  untrustedUntil = 0;
  flagUntil = 0;
  clickLog.length = 0;
  recentTimes.length = 0;
  strikes.length = 0;
  runAnchor = null;
  runCount = 0;
  warnedOnce = true;
  paused = false;
  hideWarn();
});

function setMenu(open) {
  el.menuPanel.classList.toggle('open', open);
  el.menuPanel.style.height = open ? el.menuPanel.querySelector('.panelInner').offsetHeight + 'px' : '';
  el.menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

el.menuBtn.addEventListener('click', e => {
  e.stopPropagation();
  setMenu(true);
});
document.addEventListener('click', () => setMenu(false));
el.musicBtn.addEventListener('click', () => setMusicOn(!musicOn));
el.clearBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!clearArmed) {
    clearArmed = true;
    el.clearBtn.textContent = 'tap again to clear';
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => {
      clearArmed = false;
      el.clearBtn.textContent = 'clear progress';
    }, 3000);
    return;
  }
  wipe();
});

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function visibleCap() { return cursorsHigh ? MAX_VISIBLE_CURSORS : Math.floor(MAX_VISIBLE_CURSORS / 2); }
function refreshPerfLabels() {
  el.perfBtn.textContent = 'performance: ' + perfMaster;
  el.counterBtn.textContent = 'counter: ' + (counterHigh ? 'high' : 'low');
  el.cursorsBtn.textContent = 'cursors: ' + (cursorsHigh ? 'high' : 'low');
}
function setPerf(p) {
  perfMaster = p;
  counterHigh = p === 'high';
  cursorsHigh = p === 'high';
  store(PERF_KEY, p);
  store(COUNTER_KEY, counterHigh ? 'high' : 'low');
  store(CURSOR_KEY, cursorsHigh ? 'high' : 'low');
  forceCount = true;
  refreshPerfLabels();
  render();
}
el.perfBtn.addEventListener('click', e => {
  e.stopPropagation();
  setPerf(perfMaster === 'high' ? 'low' : 'high');
});
el.counterBtn.addEventListener('click', e => {
  e.stopPropagation();
  counterHigh = !counterHigh;
  store(COUNTER_KEY, counterHigh ? 'high' : 'low');
  forceCount = true;
  refreshPerfLabels();
  render();
});
el.cursorsBtn.addEventListener('click', e => {
  e.stopPropagation();
  cursorsHigh = !cursorsHigh;
  store(CURSOR_KEY, cursorsHigh ? 'high' : 'low');
  refreshPerfLabels();
});
refreshPerfLabels();

load();
el.musicBtn.textContent = musicOn ? 'music on' : 'music off';
refreshAchievementUI();
render();
updateOrbit();

setInterval(save, 3000);
window.addEventListener('pagehide', () => { running = false; silenceMusic(); save(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    silenceMusic();
    save();
  }
});

let last = performance.now();
function frame(now) {
  frameNo++;
  const dt = Math.min(now - last, 1000);
  last = now;
  const sus = suspicious(now);

  if (!paused && sus) {
    paused = true;
    showWarn();
  }

  if (paused) {
    if (warnedOnce) {
      flaggedMs += dt;
      updateWarnCount();
      if (flaggedMs >= WIPE_MS) { wipe(); return; }
    }
    updateMusic();
    updateOrbit();
    render();
    requestAnimationFrame(frame);
    return;
  }

  if (running) {
    elapsed += dt;
    orbitAngle = (orbitAngle + dt * ORBIT_DEG_PER_MS) % 360;
    const sec = dt / 1000;
    addCookies(cursorCps(state.cursors) * sec);
    if (state.rushLeft > 0) state.rushLeft = Math.max(0, state.rushLeft - dt);
  }

  updateMusic();
  updateOrbit();
  render();
  checkAchievements();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('dblclick', e => e.preventDefault());
['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault())
);
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('wheel', e => {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
});
</script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
